<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Convert text to speech with customizable voice presets, speed, and pitch." />
    <title>Text2Voice | AI Speech Synthesis</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            background-image: radial-gradient(at 0% 0%, hsla(210,100%,93%,1) 0, transparent 50%), 
                              radial-gradient(at 50% 0%, hsla(225,100%,90%,1) 0, transparent 50%), 
                              radial-gradient(at 100% 0%, hsla(210,100%,93%,1) 0, transparent 50%);
            scroll-behavior: smooth;
        }

        .glass {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .speaking-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: .7; transform: scale(1.05); }
        }

        input[type="range"] {
            height: 6px;
            -webkit-appearance: none;
            background: #e2e8f0;
            border-radius: 10px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: #2563eb;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.2);
        }
    </style>
</head>

<body class="min-h-screen flex flex-col">

    <nav class="fixed top-0 w-full z-50 py-4 px-8 glass flex justify-between items-center border-b border-slate-200/50">
        <div class="flex items-center gap-2 group cursor-pointer">
            <div class="p-1.5 bg-blue-600 rounded-lg text-white group-hover:rotate-12 transition-transform">
                <i data-lucide="waveform" class="w-5 h-5"></i>
            </div>
            <span class="text-xl font-bold tracking-tight text-slate-800">Text2Voice</span>
        </div>
        <div class="flex items-center gap-6">
            <a href="/docs" class="text-sm font-semibold text-slate-600 hover:text-blue-600 transition">Documentation</a>
            <a href="https://github.com/PranjalPanging" class="p-2 hover:bg-white rounded-full transition border border-transparent hover:border-slate-200">
                <i data-lucide="github" class="w-5 h-5 text-slate-700"></i>
            </a>
        </div>
    </nav>

    <main class="flex-grow flex flex-col items-center justify-center px-4 pt-32 pb-16">
        
        <div class="glass max-w-5xl w-full rounded-[2.5rem] shadow-2xl shadow-blue-200/40 overflow-hidden flex flex-col md:flex-row">
            
            <div class="w-full md:w-80 bg-slate-50/40 p-8 border-r border-slate-200/60">
                <h3 class="text-[10px] font-bold uppercase tracking-[0.2em] text-slate-400 mb-8 px-1">Engine Configuration</h3>
                
                <div class="mb-8">
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-3 px-1 flex items-center gap-2">
                        <i data-lucide="user" class="w-3.5 h-3.5"></i> Voice Preset
                    </label>
                    <select id="voice" class="w-full p-3 bg-white border border-slate-200 rounded-2xl text-sm focus:ring-4 focus:ring-blue-500/10 outline-none transition-all cursor-pointer">
                        <option value="normal">Standard Studio</option>
                        <option value="male">Deep Baritone</option>
                        <option value="female">Soft Soprano</option>
                        <option value="robot">Cybernetic</option>
                        <option value="calm">Lullaby/Calm</option>
                    </select>
                </div>

                <div class="space-y-8">
                    <div>
                        <div class="flex justify-between mb-3 px-1">
                            <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">Playback Rate</label>
                            <span id="rateVal" class="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-md">1.0x</span>
                        </div>
                        <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1" class="w-full accent-blue-600 cursor-pointer">
                    </div>

                    <div>
                        <div class="flex justify-between mb-3 px-1">
                            <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">Tone Pitch</label>
                            <span id="pitchVal" class="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-md">1.0x</span>
                        </div>
                        <input type="range" id="pitch" min="0" max="2" step="0.1" value="1" class="w-full accent-blue-600 cursor-pointer">
                    </div>
                </div>

                <div class="mt-12 p-5 bg-blue-600 rounded-[2rem] text-white shadow-xl shadow-blue-200">
                    <div class="flex items-center gap-3 mb-2">
                        <i data-lucide="zap" class="w-4 h-4 fill-white"></i>
                        <span class="text-xs font-bold uppercase">Pro Tip</span>
                    </div>
                    <p class="text-[11px] leading-relaxed opacity-90">
                        Adjust pitch to 0.8x for a more cinematic and authoritative narration style.
                    </p>
                </div>
            </div>

            <div class="flex-1 p-8 md:p-10 flex flex-col">
                <div class="flex items-center justify-between mb-6">
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                        <h2 class="text-sm font-bold text-slate-800 uppercase tracking-widest">Input Canvas</h2>
                    </div>
                    <span id="charCount" class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">0 / 5000 chars</span>
                </div>
                
                <div class="relative flex-grow group">
                    <textarea
                        id="text"
                        placeholder="Type your script here..."
                        class="w-full h-72 p-6 bg-white/50 border border-slate-200 rounded-[2rem] focus:border-blue-400 focus:ring-4 focus:ring-blue-500/5 focus:outline-none transition-all resize-none text-slate-700 leading-relaxed text-lg"
                    ></textarea>
                    
                    <div id="visualizer" class="absolute bottom-8 left-8 flex items-end gap-1.5 opacity-0 transition-opacity duration-500">
                        <div class="w-1.5 h-4 bg-blue-400 rounded-full animate-bounce"></div>
                        <div class="w-1.5 h-8 bg-blue-500 rounded-full animate-bounce [animation-delay:0.2s]"></div>
                        <div class="w-1.5 h-12 bg-blue-600 rounded-full animate-bounce [animation-delay:0.4s]"></div>
                        <div class="w-1.5 h-6 bg-blue-400 rounded-full animate-bounce [animation-delay:0.1s]"></div>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-8">
                    <button id="speakBtn" class="sm:col-span-2 bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-bold transition-all shadow-lg shadow-blue-200 flex items-center justify-center gap-3 active:scale-[0.98]">
                        <i data-lucide="play" class="w-5 h-5 fill-current"></i>
                        Synthesize Speech
                    </button>
                    <button id="stopBtn" class="bg-white border border-slate-200 text-slate-600 py-4 rounded-2xl font-bold hover:bg-red-50 hover:text-red-600 hover:border-red-200 transition-all flex items-center justify-center gap-2">
                        <i data-lucide="square" class="w-4 h-4 fill-current"></i>
                        Stop
                    </button>
                </div>

                <div class="mt-6 flex flex-col sm:flex-row items-center gap-4 p-3 bg-slate-50/80 border border-slate-200/60 rounded-[1.5rem]">
                    <div class="relative w-full">
                        <i data-lucide="file-audio" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                        <input type="text" id="filename" placeholder="Save as..." class="w-full bg-white border border-slate-200 pl-11 pr-4 py-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/10 transition-all">
                    </div>
                    <button id="downloadBtn" class="w-full sm:w-auto bg-slate-800 text-white px-8 py-2.5 rounded-xl text-sm font-bold hover:bg-black transition-all flex items-center justify-center gap-2 shadow-md">
                        <i data-lucide="download" class="w-4 h-4"></i>
                        Export
                    </button>
                </div>
                
                <p id="status" class="text-center text-[11px] font-bold text-slate-400 uppercase tracking-widest mt-6 h-4"></p>
                <audio id="audio" controls class="w-full mt-4 hidden"></audio>
            </div>
        </div>
    </main>

    <footer class="py-12 text-center border-t border-slate-200/50 glass mt-auto">
        <div class="flex justify-center gap-8 mb-6">
            <a href="https://linkedin.com/in/pranjalpanging/" class="text-slate-400 hover:text-blue-600 transition hover:scale-110"><i data-lucide="linkedin"></i></a>
            <a href="https://instagram.com/pangnosis/" class="text-slate-400 hover:text-pink-500 transition hover:scale-110"><i data-lucide="instagram"></i></a>
            <a href="https://github.com/PranjalPanging" class="text-slate-400 hover:text-slate-900 transition hover:scale-110"><i data-lucide="github"></i></a>
        </div>
        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-[0.4em]">Designed & Engineered by Pranjal Panging &copy; 2025</p>
    </footer>

    <script>
        lucide.createIcons();

        const textarea = document.getElementById('text');
        const charCount = document.getElementById('charCount');
        const visualizer = document.getElementById('visualizer');
        const speakBtn = document.getElementById('speakBtn');

        textarea.addEventListener('input', (e) => {
            charCount.textContent = `${e.target.value.length} / 5000 chars`;
        });

        speakBtn.addEventListener('click', () => {
            if(textarea.value.trim() === "") return;
            visualizer.classList.replace('opacity-0', 'opacity-100');
            setTimeout(() => visualizer.classList.replace('opacity-100', 'opacity-0'), 5000);
        });

        const updateSliderDisplay = (inputId, displayId) => {
            const input = document.getElementById(inputId);
            const display = document.getElementById(displayId);
            input.addEventListener('input', () => {
                display.textContent = `${parseFloat(input.value).toFixed(1)}x`;
            });
        };

        updateSliderDisplay('rate', 'rateVal');
        updateSliderDisplay('pitch', 'pitchVal');
    </script>
    <script src="{{ url_for('static', filename='tts.js') }}"></script>
</body>
</html>
